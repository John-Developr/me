<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>New Contact Message — A7LNX</title>
</head>
<body style="margin:0; padding:0; background-color:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">

  <table width="100%" cellpadding="0" cellspacing="0" style="padding: 40px 20px;">
    <tr>
      <td align="center">

        <!-- Outer wrapper -->
        <table width="580" cellpadding="0" cellspacing="0" style="max-width:580px;">

          <!-- Top label -->
          <tr>
            <td style="padding-bottom: 16px;">
              <table cellpadding="0" cellspacing="0">
                <tr>
                  <td>
                    <img src="https://johncarlo-portfolio.vercel.app/_next/image?url=%2FLogo.png&w=256&q=75" height="10" width="50"alt="Logo">
                    <span style="margin-top:10px; display:block; font-size:13px; letter-spacing:0.06em; color:#94a3b8; text-transform:uppercase;">Contact Notification</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Main card -->
          <table width="580" cellpadding="0" cellspacing="0"
            style="background:#ffffff; border-radius:5px; border:1px solid #e5e5e5; overflow:hidden; max-width:580px;">

            <!-- Header -->
            <tr>
              <td style="background:#282a36; padding:28px 32px;">
                <table width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    <td>
                      <p style="margin:0 0 4px 0; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#475569;">
                        New Message
                      </p>
                      <h1 style="margin:0; font-size:20px; font-weight:600; color:#f8fafc; letter-spacing:-0.02em;">
                        Someone reached out
                      </h1>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Divider -->
            <tr>
              <td style="height:1px; background:#e5e5e5; padding:0;"></td>
            </tr>

            <!-- Sender details -->
            <tr>
              <td style="padding:28px 32px 0 32px;">
                <table width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    <!-- Name -->
                    <td width="50%" style="padding-bottom:20px; padding-right:12px; vertical-align:top;">
                      <p style="margin:0 0 4px 0; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:#94a3b8;">Full Name</p>
                      <p style="margin:0; font-size:15px; font-weight:600; color:#282a36;">{{fname}} {{lname}}</p>
                    </td>
                  </tr>
                  <tr>
                    <!-- Email -->
                    <td width="50%" style="padding-bottom:20px; vertical-align:top;">
                      <p style="margin:0 0 4px 0; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:#94a3b8;">Email</p>
                      <p style="margin:0; font-size:15px; font-weight:500; color:#282a36;">{{email}}</p>
                    </td>
                  </tr>
                  <tr>
                    <!-- Subject -->
                    <td width="50%" style="padding-bottom:20px; padding-right:12px; vertical-align:top;">
                      <p style="margin:0 0 4px 0; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:#94a3b8;">Subject</p>
                      <p style="margin:0; font-size:15px; font-weight:500; color:#282a36;">{{subject}}</p>
                    </td>
                    <!-- Inquiry Type -->
                  </tr>
                  <tr>
                    <td width="50%" style="padding-bottom:20px; vertical-align:top;">
                      <p style="margin:0 0 4px 0; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:#94a3b8;">Inquiry Type</p>
                      <p style="margin:0;">
                        <span style="display:inline-block; font-size:12px; font-weight:600; color:#282a36; background:#f1f5f9; border-radius:5px; padding:3px 10px; letter-spacing:0.03em;">
                          {{type}}
                        </span>
                      </p>
                    </td>
                  </tr>
                  <!-- Budget -->
                  <tr>
                    <td colspan="2" style="padding-bottom:20px; vertical-align:top;">
                      <p style="margin:0 0 4px 0; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:#94a3b8;">Budget</p>
                      <p style="margin:0; font-size:15px; font-weight:600; color:#282a36;">{{budget}}</p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Divider -->
            <tr>
              <td style="padding:0 32px;">
                <div style="height:1px; background:#f1f5f9;"></div>
              </td>
            </tr>

            <!-- Message body -->
            <tr>
              <td style="padding:24px 32px 32px 32px;">
                <p style="margin:0 0 10px 0; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:#94a3b8;">Message</p>
                <div style="background:#f8fafc; border-radius:2px; border-left:3px solid #282a36; padding:18px 20px;">
                  <p style="margin:0; font-size:14px; line-height:1.75; color:#334155; white-space: pre-line;">{{message}}</p>
                </div>
              </td>
            </tr>

          </table>
          <!-- /Main card -->

          <!-- Footer -->
          <tr>
            <td style="padding-top:20px; text-align:center;">
              <p style="margin:0; font-size:11px; color:#94a3b8; letter-spacing:0.04em;">
                © <strong style="color:#64748b;">A7LNX</strong> &nbsp;·&nbsp; John Carlo A. Ylanan &nbsp;·&nbsp; Cebu, Philippines
              </p>
            </td>
          </tr>

        </table>
        <!-- /Outer wrapper -->

      </td>
    </tr>
  </table>

</body>
</html>
